name: Quorum
description: Two lenses, one finding. Confirmed Solidity findings as SARIF, each naming both witnesses and what each read.
branding:
  icon: check-circle
  color: green
inputs:
  targets:
    description: Space-separated Solidity files or globs, relative to the repository root.
    required: true
  sarif:
    description: Where to write the SARIF log, inside the workspace.
    default: quorum.sarif
  upload:
    description: "Upload the log to the Security tab. The calling job needs permissions: security-events: write."
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"
    # The code that runs is the code at the ref you pinned (Yonkoo11/quorum@<tag or sha>), and
    # nothing fetched at run time from a branch.
    - shell: bash
      run: python -m pip install --quiet -r "$GITHUB_ACTION_PATH/requirements.txt" "$GITHUB_ACTION_PATH"
    - shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
        SARIF: ${{ inputs.sarif }}
      run: |
        case "$SARIF" in
          /*|*..*) echo "sarif must be a relative path inside the workspace"; exit 1;;
        esac
        shopt -s globstar nullglob
        # shellcheck disable=SC2086  # TARGETS is a space-separated list of paths and globs
        quorum --db "$RUNNER_TEMP/quorum-memory.db" run --targets $TARGETS --sarif "$SARIF" --summary "$RUNNER_TEMP/quorum-summary.md"
        # The page a reviewer sees from the pull request's checks. Needs no write token.
        cat "$RUNNER_TEMP/quorum-summary.md" >> "$GITHUB_STEP_SUMMARY"
    # The same page as an artifact, so a later job that runs no repository code can post it as a comment.
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: quorum-summary
        path: ${{ runner.temp }}/quorum-summary.md
        retention-days: 7
    - if: inputs.upload == 'true'
      uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
      with:
        sarif_file: ${{ inputs.sarif }}
        category: quorum
