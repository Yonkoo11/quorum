[project]
name = "quorum-swarm"
version = "0.1.0"
description = "A swarm of security lenses that coordinates only through Sibyl Memory"
requires-python = ">=3.10"
dependencies = ["sibyl-memory-client>=0.8.1", "web3>=6.20.0", "requests>=2.32.0"]

[project.scripts]
quorum = "quorum.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["quorum"]
