<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Quorum">
  <title>Quorum</title>
  <defs>
    <clipPath id="q-left"><circle cx="196" cy="256" r="132"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0b0f0c"/>
  <!-- two lenses, drawn independently: neither one is the finding -->
  <circle cx="196" cy="256" r="132" fill="none" stroke="#3fb950" stroke-opacity="0.55" stroke-width="14"/>
  <circle cx="316" cy="256" r="132" fill="none" stroke="#3fb950" stroke-opacity="0.55" stroke-width="14"/>
  <!-- the intersection is the only thing that gets published -->
  <g clip-path="url(#q-left)">
    <circle cx="316" cy="256" r="132" fill="#3fb950"/>
  </g>
</svg>
