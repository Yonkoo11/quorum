<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Quorum — 296k ATH</title>
<style>
  @font-face {
    font-family: "Archivo Black";
    src: url("fonts/ArchivoBlack-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "IBM Plex Sans";
    src: url("fonts/IBMPlexSans-Medium.ttf") format("truetype");
    font-weight: 500;
    font-style: normal;
    font-display: block;
  }

  :root {
    --paper: #f3eee4;
    --ink: #121212;
    --green: #3fb950;
    --green-ink: #2a8a38;
    --muted: #8b8578;
    --black: #111111;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1280px;
    height: 720px;
    background: #ffffff;
    overflow: hidden;
  }

  .frame {
    width: 1280px;
    height: 720px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    position: relative;
    width: 1224px;
    height: 664px;
    background: var(--paper);
    border-radius: 36px;
    overflow: hidden;
    box-shadow: 0 18px 40px rgba(18, 18, 18, 0.10), 0 2px 0 rgba(18, 18, 18, 0.04);
  }

  .swarm {
    position: absolute;
    inset: 0 0 210px 0;
    z-index: 1;
  }

  .swarm svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .copy {
    position: absolute;
    left: 72px;
    right: 72px;
    bottom: 0;
    height: 210px;
    z-index: 3;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding-bottom: 52px;
    background: linear-gradient(to top, #f3eee4 62%, rgba(243,238,228,0));
  }

  .kicker {
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 500;
    font-size: 14px;
    letter-spacing: 0.28em;
    color: var(--green-ink);
    text-transform: uppercase;
    line-height: 1;
    margin-bottom: 18px;
  }

  h1 {
    font-family: "Archivo Black", sans-serif;
    font-weight: 400;
    font-size: 84px;
    line-height: 0.86;
    letter-spacing: -0.045em;
    color: var(--ink);
    text-transform: uppercase;
  }

  h1 em {
    font-style: normal;
    color: var(--green);
  }

  .meta {
    text-align: right;
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 500;
    padding-bottom: 8px;
  }

  .status {
    font-size: 13px;
    letter-spacing: 0.34em;
    color: var(--muted);
    text-transform: uppercase;
    line-height: 1;
  }

  .note {
    margin-top: 14px;
    font-size: 15px;
    letter-spacing: 0.08em;
    color: var(--muted);
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="frame">
    <article class="card">
      <div class="swarm" aria-hidden="true">
        <svg id="swarm" viewBox="0 0 1224 454" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div class="copy">
        <div class="lead">
          <div class="kicker">runquorum.site</div>
          <h1>296k. <em>Ath.</em></h1>
        </div>
        <div class="meta">
          <div class="status">day 1 print</div>
          <div class="note">11 sep 2026 · 10:55 utc</div>
        </div>
      </div>
    </article>
  </div>
  <script>
    (function () {
      function mulberry32(a) {
        return function () {
          a |= 0; a = (a + 0x6D2B79F5) | 0;
          var t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      var HOLDERS = 535;
      var r = 214;
      var d = r * 0.91;
      var c1 = { x: 612 - d / 2, y: 222 };
      var c2 = { x: 612 + d / 2, y: 222 };
      var rand = mulberry32(2962026);
      var svg = document.getElementById("swarm");
      var ns = "http://www.w3.org/2000/svg";

      function inCircle(p, c) {
        var dx = p.x - c.x, dy = p.y - c.y;
        return dx * dx + dy * dy <= r * r;
      }

      function hexPoints(spacing) {
        var pts = [];
        var minx = Math.min(c1.x, c2.x) - r;
        var maxx = Math.max(c1.x, c2.x) + r;
        var miny = c1.y - r;
        var maxy = c1.y + r;
        var rowH = spacing * Math.sqrt(3) / 2;
        var row = 0;
        for (var y = miny; y <= maxy + 0.01; y += rowH, row++) {
          var ox = (row % 2) * spacing / 2;
          for (var x = minx + ox; x <= maxx + 0.01; x += spacing) {
            var p = { x: x, y: y };
            if (inCircle(p, c1) || inCircle(p, c2)) pts.push(p);
          }
        }
        return pts;
      }

      var lo = 12, hi = 28, pts = [];
      for (var i = 0; i < 18; i++) {
        var mid = (lo + hi) / 2;
        pts = hexPoints(mid);
        if (pts.length > HOLDERS) lo = mid;
        else hi = mid;
      }
      pts = hexPoints(lo);
      while (pts.length > HOLDERS) {
        pts.splice(Math.floor(rand() * pts.length), 1);
      }

      pts.forEach(function (p) {
        var both = inCircle(p, c1) && inCircle(p, c2);
        var dot = document.createElementNS(ns, "circle");
        dot.setAttribute("cx", p.x.toFixed(2));
        dot.setAttribute("cy", p.y.toFixed(2));
        dot.setAttribute("r", both ? 5.4 : 3.6);
        dot.setAttribute("fill", both ? "#3fb950" : "#111111");
        if (!both) dot.setAttribute("fill-opacity", "0.50");
        svg.appendChild(dot);
      });

      [c1, c2].forEach(function (c) {
        var ring = document.createElementNS(ns, "circle");
        ring.setAttribute("cx", c.x);
        ring.setAttribute("cy", c.y);
        ring.setAttribute("r", r);
        ring.setAttribute("fill", "none");
        ring.setAttribute("stroke", "#111111");
        ring.setAttribute("stroke-width", "10");
        ring.setAttribute("stroke-opacity", "0.18");
        svg.appendChild(ring);
      });
    })();
  </script>
</body>
</html>
