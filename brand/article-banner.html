<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Quorum: X article cover 1920x368</title>
<style>
  @font-face {
    font-family: "Archivo Black";
    src: url("fonts/ArchivoBlack-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "IBM Plex Sans";
    src: url("fonts/IBMPlexSans-Medium.ttf") format("truetype");
    font-weight: 500;
    font-style: normal;
    font-display: block;
  }

  :root {
    --paper: #f3eee4;
    --ink: #121212;
    --green: #3fb950;
    --green-ink: #2a8a38;
    --black: #111111;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1920px;
    height: 368px;
    background: var(--paper);
    overflow: hidden;
  }

  .card {
    position: relative;
    width: 1920px;
    height: 368px;
    background: var(--paper);
    overflow: hidden;
  }

  .copy {
    position: absolute;
    left: 72px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 3;
  }

  .rule {
    width: 32px;
    height: 3px;
    background: var(--green-ink);
    margin-bottom: 14px;
  }

  .kicker {
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 500;
    font-size: 14px;
    letter-spacing: 0.28em;
    color: var(--green-ink);
    text-transform: uppercase;
    line-height: 1;
  }

  h1 {
    margin-top: 18px;
    font-family: "Archivo Black", sans-serif;
    font-weight: 400;
    font-size: 72px;
    line-height: 0.92;
    letter-spacing: -0.04em;
    color: var(--ink);
    text-transform: uppercase;
    white-space: nowrap;
  }

  .anchor {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 48px;
    height: 48px;
    background: var(--black);
    z-index: 4;
  }

  .art {
    position: absolute;
    right: 0;
    top: 0;
    width: 720px;
    height: 368px;
    z-index: 2;
    pointer-events: none;
  }

  .art svg {
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
  <article class="card">
    <div class="copy">
      <div class="rule"></div>
      <div class="kicker">HEY Research</div>
      <h1>Claim Quorum.</h1>
    </div>
    <div class="anchor" aria-hidden="true"></div>
    <div class="art" aria-hidden="true">
      <svg viewBox="0 0 720 368" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="left-lens-banner">
            <circle cx="430" cy="184" r="150"/>
          </clipPath>
        </defs>
        <rect x="652" y="0" width="68" height="368" fill="#111111"/>
        <polygon points="520,368 720,220 720,368" fill="#111111"/>
        <circle cx="430" cy="184" r="150" fill="#f3eee4"/>
        <circle cx="560" cy="184" r="150" fill="#f3eee4"/>
        <g clip-path="url(#left-lens-banner)">
          <circle cx="560" cy="184" r="150" fill="#3fb950"/>
        </g>
        <circle cx="430" cy="184" r="150" fill="none" stroke="#111111" stroke-width="18"/>
        <circle cx="560" cy="184" r="150" fill="none" stroke="#111111" stroke-width="18"/>
      </svg>
    </div>
  </article>
</body>
</html>
