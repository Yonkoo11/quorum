<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Quorum: X banner</title>
<style>
  @font-face { font-family: "Archivo Black"; src: url("fonts/ArchivoBlack-Regular.ttf") format("truetype"); font-weight: 400; font-display: block; }
  @font-face { font-family: "IBM Plex Sans"; src: url("fonts/IBMPlexSans-Medium.ttf") format("truetype"); font-weight: 500; font-display: block; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1500px; height: 500px; background: #f3eee4; overflow: hidden; }
  .banner { position: relative; width: 1500px; height: 500px; background: #f3eee4; }
  /* X shows the middle band on phones and covers the bottom-left with the avatar: everything sits in the centre band, right of the avatar. */
  .copy { position: absolute; left: 120px; top: 150px; }
  .word { font-family: "Archivo Black", sans-serif; font-size: 96px; line-height: 1; letter-spacing: -0.02em; color: #121212; text-transform: uppercase; }
  .line { margin-top: 22px; max-width: 760px; line-height: 1.35; font-family: "IBM Plex Sans", sans-serif; font-weight: 500; font-size: 26px; letter-spacing: 0.02em; color: #121212; }
  .line span { color: #24772f; }
  .art { position: absolute; right: 110px; top: 50%; transform: translateY(-50%); width: 480px; height: 360px; }
  .art svg { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
  <div class="banner">
    <div class="copy">
      <div class="word">Quorum</div>
      <div class="line">Two lenses. <span>One finding.</span><br>A smart-contract scanner that reports only where two readings agree.</div>
    </div>
    <div class="art" aria-hidden="true">
      <svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
        <defs><clipPath id="l"><circle cx="146" cy="150" r="112"/></clipPath></defs>
        <g clip-path="url(#l)"><circle cx="264.7" cy="150" r="112" fill="#3fb950"/></g>
        <circle cx="146" cy="150" r="112" fill="none" stroke="#121212" stroke-width="22.4"/>
        <circle cx="264.7" cy="150" r="112" fill="none" stroke="#121212" stroke-width="22.4"/>
      </svg>
    </div>
  </div>
</body>
</html>
