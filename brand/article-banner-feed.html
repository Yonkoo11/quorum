<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Quorum: article share image 1600x900</title>
<style>
  @font-face {
    font-family: "Archivo Black";
    src: url("fonts/ArchivoBlack-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "IBM Plex Sans";
    src: url("fonts/IBMPlexSans-Medium.ttf") format("truetype");
    font-weight: 500;
    font-style: normal;
    font-display: block;
  }

  :root {
    --paper: #f3eee4;
    --ink: #121212;
    --green: #3fb950;
    --green-ink: #2a8a38;
    --black: #111111;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1600px;
    height: 900px;
    background: #fbfaf7;
    overflow: hidden;
  }

  .frame {
    width: 1600px;
    height: 900px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fbfaf7;
  }

  .card {
    position: relative;
    width: 1528px;
    height: 828px;
    background: var(--paper);
    border-radius: 36px;
    overflow: hidden;
    box-shadow: 0 18px 40px rgba(18, 18, 18, 0.10), 0 2px 0 rgba(18, 18, 18, 0.04);
  }

  .copy {
    position: absolute;
    left: 88px;
    top: 220px;
    z-index: 3;
  }

  .rule {
    width: 32px;
    height: 3px;
    background: var(--green-ink);
    margin-bottom: 20px;
  }

  .kicker {
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 500;
    font-size: 16px;
    letter-spacing: 0.28em;
    color: var(--green-ink);
    text-transform: uppercase;
    line-height: 1;
  }

  h1 {
    margin-top: 36px;
    font-family: "Archivo Black", sans-serif;
    font-weight: 400;
    font-size: 92px;
    line-height: 0.92;
    letter-spacing: -0.04em;
    color: var(--ink);
    text-transform: uppercase;
  }

  h1 span { display: block; }

  .anchor {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 68px;
    height: 68px;
    background: var(--black);
    z-index: 4;
  }

  .art {
    position: absolute;
    right: 0;
    top: 0;
    width: 700px;
    height: 828px;
    z-index: 2;
    pointer-events: none;
  }

  .art svg { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
  <div class="frame">
    <article class="card">
      <div class="copy">
        <div class="rule"></div>
        <div class="kicker">HEY Research</div>
        <h1>
          <span>Claim</span>
          <span>Quorum.</span>
        </h1>
      </div>
      <div class="anchor" aria-hidden="true"></div>
      <div class="art" aria-hidden="true">
        <svg viewBox="0 0 700 828" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <clipPath id="left-lens-feed">
              <circle cx="250" cy="220" r="210"/>
            </clipPath>
          </defs>
          <rect x="608" y="0" width="92" height="828" fill="#111111"/>
          <rect x="300" y="0" width="400" height="48" fill="#111111"/>
          <polygon points="450,828 700,520 700,828" fill="#111111"/>
          <circle cx="250" cy="220" r="210" fill="#f3eee4"/>
          <circle cx="440" cy="220" r="210" fill="#f3eee4"/>
          <g clip-path="url(#left-lens-feed)">
            <circle cx="440" cy="220" r="210" fill="#3fb950"/>
          </g>
          <circle cx="250" cy="220" r="210" fill="none" stroke="#111111" stroke-width="24"/>
          <circle cx="440" cy="220" r="210" fill="none" stroke="#111111" stroke-width="24"/>
        </svg>
      </div>
    </article>
  </div>
</body>
</html>
