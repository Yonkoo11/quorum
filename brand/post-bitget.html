<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Quorum: Bitget card</title>
<style>
  @font-face {
    font-family: "Archivo Black";
    src: url("fonts/ArchivoBlack-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "IBM Plex Sans";
    src: url("fonts/IBMPlexSans-Medium.ttf") format("truetype");
    font-weight: 500;
    font-style: normal;
    font-display: block;
  }

  :root {
    --paper: #f3eee4;
    --ink: #121212;
    --green: #3fb950;
    --green-ink: #2a8a38;
    --muted: #8b8578;
    --black: #111111;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1280px;
    height: 720px;
    background: #fbfaf7;
    overflow: hidden;
  }

  .frame {
    width: 1280px;
    height: 720px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fbfaf7;
  }

  .card {
    position: relative;
    width: 1224px;
    height: 664px;
    background: var(--paper);
    border-radius: 36px;
    overflow: hidden;
    box-shadow: 0 18px 40px rgba(18, 18, 18, 0.10), 0 2px 0 rgba(18, 18, 18, 0.04);
  }

  .copy {
    position: absolute;
    left: 72px;
    top: 0;
    bottom: 0;
    width: 620px;
    z-index: 3;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-bottom: 28px;
  }

  .rule {
    width: 48px;
    height: 4px;
    background: var(--green-ink);
    margin-bottom: 22px;
  }

  .kicker {
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 500;
    font-size: 28px;
    letter-spacing: 0.04em;
    color: #1a6428;
    text-transform: uppercase;
    line-height: 1.15;
  }

  .status {
    margin-top: 8px;
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 500;
    font-size: 28px;
    letter-spacing: 0.01em;
    color: #2c2924;
    text-transform: uppercase;
    line-height: 1.15;
  }

  h1 {
    margin-top: 28px;
    font-family: "Archivo Black", sans-serif;
    font-weight: 400;
    line-height: 0.92;
    letter-spacing: -0.035em;
    color: var(--ink);
    text-transform: uppercase;
  }

  h1 span { display: block; }
  h1 .figure { font-size: 68px; }
  h1 .where { margin-top: 12px; font-size: 40px; letter-spacing: -0.03em; }

  .anchor {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 68px;
    height: 68px;
    background: var(--black);
    z-index: 4;
  }

  .art {
    position: absolute;
    right: 0;
    top: 0;
    width: 560px;
    height: 664px;
    z-index: 2;
    pointer-events: none;
  }

  .art svg {
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
  <div class="frame">
    <article class="card" id="card">
      <div class="copy">
        <div class="rule"></div>
        <div class="kicker">runquorum.site</div>
        <div class="status">24 september 2026</div>
        <h1>
          <span class="figure">~$351.6M</span>
          <span class="where">affected on bitget</span>
        </h1>
      </div>

      <div class="anchor" aria-hidden="true"></div>

      <div class="art" aria-hidden="true">
        <svg viewBox="0 0 560 664" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <clipPath id="left-lens-bitget">
              <circle cx="187" cy="176" r="176"/>
            </clipPath>
          </defs>

          <rect x="468" y="0" width="92" height="664" fill="#111111"/>
          <rect x="240" y="0" width="320" height="44" fill="#111111"/>
          <polygon points="360,664 560,430 560,664" fill="#111111"/>

          <circle cx="187" cy="176" r="176" fill="#f3eee4"/>
          <circle cx="374" cy="176" r="176" fill="#f3eee4"/>

          <g clip-path="url(#left-lens-bitget)">
            <circle cx="374" cy="176" r="176" fill="#3fb950"/>
          </g>

          <circle cx="187" cy="176" r="176" fill="none" stroke="#111111" stroke-width="35"/>
          <circle cx="374" cy="176" r="176" fill="none" stroke="#111111" stroke-width="35"/>
        </svg>
      </div>
    </article>
  </div>
</body>
</html>
