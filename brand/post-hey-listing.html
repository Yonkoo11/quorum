<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Quorum: Hey Research listing card</title>
<style>
  @font-face { font-family: "Archivo Black"; src: url("fonts/ArchivoBlack-Regular.ttf") format("truetype"); font-weight: 400; font-display: block; }
  @font-face { font-family: "IBM Plex Sans"; src: url("fonts/IBMPlexSans-Medium.ttf") format("truetype"); font-weight: 500; font-display: block; }
  :root { --dark: #0d100d; --paper: #e9ede9; --green: #3fb950; --muted: #8a938a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; background: #0d100d; overflow: hidden; }
  .card { position: relative; width: 1280px; height: 720px; background: var(--dark); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 44px; }
  .art { width: 300px; height: 225px; }
  .art svg { width: 100%; height: 100%; display: block; }
  h1 { font-family: "Archivo Black", sans-serif; font-weight: 400; font-size: 88px; line-height: 1; letter-spacing: -0.04em; color: var(--paper); text-transform: uppercase; white-space: nowrap; }
  .sub { font-family: "IBM Plex Sans", sans-serif; font-weight: 500; font-size: 17px; letter-spacing: 0.3em; color: var(--green); text-transform: uppercase; line-height: 1; }
  .site { position: absolute; bottom: 56px; left: 0; right: 0; text-align: center; font-family: "IBM Plex Sans", sans-serif; font-weight: 500; font-size: 14px; letter-spacing: 0.3em; color: var(--muted); text-transform: uppercase; }
</style>
</head>
<body>
  <article class="card">
    <div class="art" aria-hidden="true">
      <svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
        <defs><clipPath id="l"><circle cx="146" cy="150" r="112"/></clipPath></defs>
        <g clip-path="url(#l)"><circle cx="264.7" cy="150" r="112" fill="#3fb950"/></g>
        <circle cx="146" cy="150" r="112" fill="none" stroke="#e9ede9" stroke-width="22.4"/>
        <circle cx="264.7" cy="150" r="112" fill="none" stroke="#e9ede9" stroke-width="22.4"/>
      </svg>
    </div>
    <h1>Now on Hey Research.</h1>
    <div class="sub">Currently shipping &middot; public evidence</div>
    <div class="site">runquorum.site</div>
  </article>
</body>
</html>
