name: diary

# What the repo did, told to the Telegram group in plain words. Every two hours,
# seven minutes past the boundary; posts nothing when nothing happened.
# Secrets: ANTHROPIC_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (repository secrets).

on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Window in hours back from the last closed boundary (blank: since the previous run)"
        required: false
        default: ""
      dry:
        description: "Print only, post nothing"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  diary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Write the entry
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.hours }}" ]; then ARGS="$ARGS --hours ${{ github.event.inputs.hours }}"; fi
          if [ "${{ github.event.inputs.dry }}" = "true" ]; then ARGS="$ARGS --dry"; fi
          python diary/diary.py $ARGS
