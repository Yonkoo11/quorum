# Quorum on its own teaching fixtures, every push. The two confirmed findings land in this
# repository's Security tab with both witnesses named in each message. The fixtures are
# vulnerable on purpose; the alerts are the demonstration.
#
# Separate jobs on purpose: the scan runs repository code with a read-only token; the upload and
# the comment, which need write-scoped tokens, run no repository code at all. The upload never
# runs on a pull request; the comment only runs on one.
name: quorum
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -e .
      - run: quorum --db "$RUNNER_TEMP/quorum-memory.db" run --targets fixtures/VulnerableVault.sol fixtures/OpenFeeSetter.sol --sarif quorum.sarif --summary quorum-summary.md
      - run: cat quorum-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quorum-sarif
          path: quorum.sarif
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quorum-summary
          path: quorum-summary.md
          retention-days: 7
  # The page as one comment on the pull request, updated in place on every push. Runs no
  # repository code; only for pull requests from this repository, where the token can write.
  comment:
    needs: scan
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: quorum-summary
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- quorum-summary -->")) | .id' | head -1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@quorum-summary.md >/dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@quorum-summary.md >/dev/null
          fi
  upload:
    needs: scan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: quorum-sarif
      - uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          sarif_file: quorum.sarif
          category: quorum
