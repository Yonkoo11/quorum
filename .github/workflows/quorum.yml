# Quorum on its own teaching fixtures, every push. The two confirmed findings land in this
# repository's Security tab with both witnesses named in each message. The fixtures are
# vulnerable on purpose; the alerts are the demonstration.
#
# Two jobs on purpose: the scan runs repository code with a read-only token, and the upload,
# which needs a write-scoped token, runs no repository code at all and never runs on a pull
# request.
name: quorum
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: quorum --db "$RUNNER_TEMP/quorum-memory.db" run --targets fixtures/VulnerableVault.sol fixtures/OpenFeeSetter.sol --sarif quorum.sarif
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quorum-sarif
          path: quorum.sarif
          retention-days: 7
  upload:
    needs: scan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: quorum-sarif
      - uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          sarif_file: quorum.sarif
          category: quorum
