[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
# Robinhood Chain runs Arbitrum's Nitro stack; Paris needs nothing newer than what any ArbOS accepts.
evm_version = "paris"
optimizer = true
optimizer_runs = 200
fs_permissions = []

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 32
fail_on_revert = false

[rpc_endpoints]
robinhood = "${QUORUM_RPC}"
